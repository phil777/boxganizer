[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "boxganizer"
description = "Personal knowledge management where everything is a box."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPLv2" }
authors = [{ name = "Philippe Biondi", email = "phil@secdev.org" }]
keywords = ["knowledge-management", "graph", "cli", "tui", "web"]
dynamic = ["version"]
dependencies = [
    # The markdown a box holds is rendered by this, and only here: see
    # `boxganizer.markdown` for why the page asks the server instead of parsing it
    # twice. It arrived before as a dependency of rich; depending on that would be
    # depending on someone else's choices.
    "markdown-it-py>=3.0",
    # A sensor's value is turned into what is shown by a template the owner writes, and
    # templates are a language: parsing one with a regex would be a second, worse language.
    # jinja2 arrived before as a dependency of rich (through typer); depending on that would
    # be depending on someone else's choices, and they are free to drop it.
    "jinja2>=3.1",
    "pillow>=10.0",
    "pypdfium2>=4.30",
    "pyyaml>=6.0",
    "typer>=0.12",
    # Every interface ships with the install (ADR 24). An extra is a way of shipping a
    # feature you did not ask for while making the one you want a separate decision, and
    # for a personal tool the interesting feature is always the one that is missing: the
    # `live` extra produced bug reports that were really "`pipx install` gave me a box that
    # cannot listen to MQTT and says so in a sentence I did not read".
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "textual>=0.80",
    "aiomqtt>=2.0",
]

# Test and lint tooling is not a feature of the program, so it is still an extra — the one
# choice left is between a 40 MB dev environment and a small install for someone who only
# wants to organise boxes.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx2>=2.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

# One console script: `box serve` and `box tui` start the other two interfaces.
[project.scripts]
box = "boxganizer.cli.main:main"

[project.urls]
Homepage = "https://example.invalid/boxganizer"
Documentation = "https://example.invalid/boxganizer/doc"

[tool.setuptools.dynamic]
version = { attr = "boxganizer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
boxganizer = ["py.typed", "web/templates/*.html", "web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]  # Typer calls defaults in signatures.

[tool.ruff.lint.isort]
known-first-party = ["boxganizer"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["textual.*", "uvicorn.*", "jinja2.*", "PIL.*", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers", "--cov=boxganizer", "--cov-report=term-missing"]
filterwarnings = ["error"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
