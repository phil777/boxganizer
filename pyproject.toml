[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "boxganizer"
description = "Personal knowledge management where everything is a box."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPLv2" }
authors = [{ name = "Philippe Biondi", email = "phil@secdev.org" }]
keywords = ["knowledge-management", "graph", "cli", "tui", "web"]
dynamic = ["version"]
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
]
tui = [
    "textual>=0.80",
]
all = ["boxganizer[web,tui]"]
dev = [
    "boxganizer[all]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx2>=2.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
boxganizer = "boxganizer.cli.main:main"
boxganizer-web = "boxganizer.web.server:main"
boxganizer-tui = "boxganizer.tui.app:main"

[project.urls]
Homepage = "https://example.invalid/boxganizer"
Documentation = "https://example.invalid/boxganizer/doc"

[tool.setuptools.dynamic]
version = { attr = "boxganizer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
boxganizer = ["py.typed", "web/templates/*.html", "web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]  # Typer calls defaults in signatures.

[tool.ruff.lint.isort]
known-first-party = ["boxganizer"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["textual.*", "uvicorn.*", "jinja2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers", "--cov=boxganizer", "--cov-report=term-missing"]
filterwarnings = ["error"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
