<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boxganizer</title>
    <link rel="stylesheet" href="/static/app.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>📦</text></svg>" />
  </head>
  <body>
    <div class="app">
      <!-- Left pane: search, the box list, and the way in to create one. -->
      <aside id="side" aria-label="Boxes">
        <div class="side-head">
          <button id="go-root" type="button" title="Show the root box">🌲 Root</button>
          <span class="brand">📦 Boxganizer</span>
          <button id="new-box" type="button" title="Create a new box">＋ New box</button>
        </div>
        <form id="search-form" autocomplete="off">
          <input id="search" type="search" placeholder="search boxes" />
        </form>
        <ul id="box-list" role="listbox" aria-label="Boxes"></ul>
        <p id="side-status" class="muted"></p>
      </aside>

      <!-- Main pane: the selected box, as its icon or as its content. -->
      <main id="main">
        <header class="main-head">
          <button id="up" type="button" title="Go to the parent box">↑</button>
          <nav id="breadcrumb" aria-label="Path"></nav>
          <div id="mode-toggle" role="group" aria-label="Display mode">
            <button type="button" data-mode="icon" title="Show the box as its icon">Icon</button>
            <button type="button" data-mode="content" title="Show the content of the box">Content</button>
          </div>
          <span id="status" class="muted"></span>
        </header>
        <section id="canvas" tabindex="-1"></section>
      </main>
    </div>

    <!-- Creating a box: pick a type, configure it, create it. -->
    <dialog id="new-box-modal" aria-label="New box">
      <form id="new-box-form" method="dialog">
        <h2>New box</h2>
        <label>Name <input id="nb-name" name="name" required /></label>
        <label>Type
          <select id="nb-type" name="box_type"></select>
        </label>
        <p id="nb-summary" class="muted"></p>
        <label>Description <input id="nb-description" name="description" /></label>
        <div class="resource-field">
          <label>Resource <input id="nb-resource" name="resource_uri" placeholder="/path or https://…" /></label>
          <button type="button" class="browse" data-resource="nb-resource" title="Pick a file from the server">
            Browse…
          </button>
        </div>
        <p id="nb-suggest" class="suggest" hidden></p>
        <label>Put it in
          <select id="nb-parent" name="parent"></select>
        </label>
        <div id="nb-config" class="config-fields"></div>
        <footer>
          <button type="button" id="nb-cancel">Cancel</button>
          <button type="submit" id="nb-create" class="primary">Create</button>
        </footer>
      </form>
    </dialog>

    <dialog id="edit-box-modal" aria-label="Modify box">
      <form id="edit-box-form" method="dialog">
        <h2>Modify box</h2>
        <label>Name <input id="eb-name" name="name" required /></label>
        <label>Type
          <select id="eb-type" name="box_type"></select>
        </label>
        <p id="eb-summary" class="muted"></p>
        <p id="eb-suggest" class="suggest" hidden></p>
        <label>Icon <input id="eb-icon" name="icon" maxlength="4" /></label>
        <label>Description <input id="eb-description" name="description" /></label>
        <div class="resource-field">
          <label>Resource <input id="eb-resource" name="resource_uri" placeholder="/path or https://…" /></label>
          <button type="button" class="browse" data-resource="eb-resource" title="Pick a file from the server">
            Browse…
          </button>
        </div>
        <div id="eb-config" class="config-fields"></div>
        <footer>
          <button type="button" id="eb-cancel">Cancel</button>
          <button type="submit" id="eb-save" class="primary">Save</button>
        </footer>
      </form>
    </dialog>

    <!-- A file selector over the server's filesystem, for the resource field. -->
    <dialog id="file-picker" aria-label="Choose a file">
      <div class="picker-head">
        <input id="fp-path" placeholder="/path" aria-label="Path" />
        <button type="button" id="fp-go">Go</button>
        <button type="button" id="fp-up" title="Up one folder">↑</button>
        <button type="button" id="fp-home" title="Home">⌂</button>
      </div>
      <p id="fp-note" class="muted"></p>
      <div class="picker-filter">
        <input id="fp-filter" placeholder="Filter names" aria-label="Filter names" />
        <label class="fp-hidden">
          <input id="fp-show-hidden" type="checkbox" />
          show hidden
        </label>
      </div>
      <div id="fp-list" class="picker-list" role="listbox" aria-label="Files"></div>
      <footer>
        <button type="button" id="fp-cancel">Cancel</button>
        <button type="button" id="fp-choose" class="primary">Choose this folder</button>
      </footer>
    </dialog>

    <!-- One context menu, filled in by the view that was clicked. -->
    <ul id="context-menu" role="menu" hidden></ul>

    <script src="/static/app.js"></script>
  </body>
</html>
